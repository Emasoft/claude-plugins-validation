# Notify marketplace repo when this plugin is updated
# Place this in each plugin repo: .github/workflows/notify-marketplace.yml
#
# SETUP INSTRUCTIONS:
# 1. Create a Personal Access Token (PAT):
#    - Go to GitHub Settings → Developer settings → Personal access tokens → Tokens (classic)
#    - Click "Generate new token (classic)"
#    - Give it a descriptive name like "Plugin Marketplace Notification"
#    - Select scope: 'repo' (Full control of private repositories)
#    - Click "Generate token" and COPY the token (you won't see it again!)
#
# 2. Add the PAT as a secret to THIS plugin repository:
#    - Go to your plugin repo → Settings → Secrets and variables → Actions
#    - Click "New repository secret"
#    - Name: MARKETPLACE_PAT
#    - Value: paste the PAT you copied in step 1
#    - Click "Add secret"
#
# 3. Update the MARKETPLACE_OWNER and MARKETPLACE_REPO variables below:
#    - MARKETPLACE_OWNER: Your GitHub username or org that owns the marketplace repo
#    - MARKETPLACE_REPO: The name of your marketplace repository
#
# IMPORTANT: Do NOT use GITHUB_TOKEN - it lacks permissions to trigger workflows in other repos!

name: Notify Marketplace

on:
  push:
    branches: [main, master]
    paths:
      - '.claude-plugin/**'
      - 'hooks/**'
      - 'commands/**'
      - 'agents/**'
      - 'skills/**'
      - 'scripts/**'

# This workflow authenticates exclusively with the MARKETPLACE_PAT secret to
# dispatch into the marketplace repo — it never needs the per-repo GITHUB_TOKEN,
# so the least-privilege scope is the empty set.
permissions: {}

env:
  # ⚠️ REQUIRED: Update these values to point to your marketplace repository
  # Example: If your marketplace is at https://github.com/johndoe/my-claude-plugins
  #   MARKETPLACE_OWNER: 'johndoe'
  #   MARKETPLACE_REPO: 'my-claude-plugins'
  MARKETPLACE_OWNER: 'YOUR_GITHUB_USERNAME'  # Replace with your GitHub username or organization
  MARKETPLACE_REPO: 'YOUR_MARKETPLACE_REPO_NAME'  # Replace with your marketplace repo name

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get plugin info
        id: plugin
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REF_SHA: ${{ github.sha }}
        run: |
          # D9 (TRDD-DFRPRZYD): the marketplace matches the dispatch on its
          # ENTRY name — the "name" field of .claude-plugin/plugin.json — which
          # can differ from the repo name. NO silent fallback: a missing,
          # unreadable, or nameless manifest fails this step loudly, because a
          # silently wrong name IS the defect this guard exists for.
          if [ ! -f ".claude-plugin/plugin.json" ]; then
            echo "::error::plugin.json not found in $REPO_NAME — cannot determine the marketplace entry name." >&2
            exit 1
          fi
          PLUGIN_NAME="$(python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['name'])")" || {
            echo "::error::plugin.json in $REPO_NAME is unreadable or has no 'name' field — refusing to notify the marketplace with a wrong plugin name." >&2
            exit 1
          }
          if [ -z "$PLUGIN_NAME" ]; then
            echo "::error::plugin.json 'name' is empty in $REPO_NAME — refusing to notify the marketplace." >&2
            exit 1
          fi
          echo "name=$PLUGIN_NAME" >> $GITHUB_OUTPUT
          echo "ref=$REF_SHA" >> $GITHUB_OUTPUT

      - name: Trigger marketplace update
        # Third-party action pinned to a full commit SHA (gh-actions rule).
        # Defensive "second-latest" pin: v4.0.0 (not v4.0.1). The latest
        # v4.0.1 SHA is healthy, but during GitHub Actions incident
        # gnftqj9htp0g (2026-05-26 auth outage) it surfaced as
        # "Failed to download archive ... 'codeload.github.com/.../<sha>'"
        # alongside dozens of other recently-bumped pins. Bleeding-edge
        # pins concentrate that risk; staying one tag behind costs
        # nothing for this use case. A future pinact bump back to
        # v4.0.1 must also drop tests/test_canon_repository_dispatch_sha_pin.py.
        uses: peter-evans/repository-dispatch@5fc4efd1a4797ddb68ffd0714a238564e4cc0e6f # v4.0.0
        with:
          token: ${{ secrets.MARKETPLACE_PAT }}
          repository: ${{ env.MARKETPLACE_OWNER }}/${{ env.MARKETPLACE_REPO }}
          event-type: plugin-updated
          client-payload: |
            {
              "plugin": "${{ steps.plugin.outputs.name }}",
              "ref": "${{ steps.plugin.outputs.ref }}",
              "source_repo": "${{ github.repository }}",
              "triggered_by": "${{ github.actor }}"
            }

      - name: Summary
        run: |
          echo "## Marketplace Notification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Triggered update in ${{ env.MARKETPLACE_OWNER }}/${{ env.MARKETPLACE_REPO }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Plugin: ${{ steps.plugin.outputs.name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ steps.plugin.outputs.ref }}" >> $GITHUB_STEP_SUMMARY
