[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

# Force-include configuration files so `uvx --from git+...` ships them
# alongside the wheel. Without this, the cached install (which ships the
# whole repo to ~/.claude/plugins/cache/) and the uvx install (which only
# bundles `packages`) disagree on which `.markdownlint.json` the linter
# uses — see issue #20. The path resolver in cpv_lint_engine looks at
# `Path(__file__).parent / ".markdownlint.json"` as the FIRST candidate so
# the in-wheel copy wins under uvx.
[tool.hatch.build.targets.wheel.force-include]
".markdownlint.json" = "scripts/.markdownlint.json"
".markdownlintignore" = "scripts/.markdownlintignore"

[project]
name = "claude-plugins-validation"
version = "2.107.6"
description = "Comprehensive validation suite for Claude Code plugins, marketplaces, hooks, skills, and MCP servers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mypy>=1.19.1",
    "pathspec>=0.12.1",
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.6",
    "pyyaml>=6.0.3",
    "ruff>=0.14.14",
    "types-pyyaml>=6.0.12",
]

# Optional dependency groups. Install with
#   pip install claude-plugins-validation[performance]
# OR
#   uvx --with google-re2 --from git+... cpv-validate ...
#
# `performance` pulls in google-re2, which the skillaudit native scanner
# uses to JIT-compile its ~500-pattern catalog into a single RE2
# automaton (5-15× faster than the Python `re` fallback). The fallback
# path keeps working without this dep, so the group is purely opt-in.
[project.optional-dependencies]
performance = [
    "google-re2>=1.1.0",
]

[project.scripts]
# Main validators — usable via uvx without installing:
#   uvx --from git+https://github.com/Emasoft/claude-plugins-validation cpv-validate /path/to/plugin
cpv-validate = "scripts.cli:validate_plugin"
cpv-validate-skill = "scripts.cli:validate_skill"
cpv-validate-hooks = "scripts.cli:validate_hooks"
cpv-validate-agents = "scripts.cli:validate_agents"
cpv-validate-command = "scripts.cli:validate_command"
cpv-validate-security = "scripts.cli:validate_security"
cpv-validate-scoring = "scripts.cli:validate_scoring"
cpv-validate-enterprise = "scripts.cli:validate_enterprise"
cpv-validate-marketplace = "scripts.cli:validate_marketplace"
cpv-validate-encoding = "scripts.cli:validate_encoding"
cpv-validate-documentation = "scripts.cli:validate_documentation"
cpv-validate-mcp = "scripts.cli:validate_mcp"
cpv-validate-lsp = "scripts.cli:validate_lsp"
cpv-validate-rules = "scripts.cli:validate_rules"
cpv-validate-xref = "scripts.cli:validate_xref"
# OTEL telemetry supply-chain validator (TRDD-e3e74f69)
cpv-validate-telemetry = "scripts.cli:validate_telemetry"
# Scope validators — validate Claude Code configuration under a project path,
# distinguishing git-tracked (project) from non-git-tracked (local) elements.
cpv-validate-project-scope = "scripts.cli:validate_project_scope"
cpv-validate-local-scope = "scripts.cli:validate_local_scope"
# TRDD-8ccb9337 IDE-config hygiene — NIT-level env-var-reference checks
# Sibling of validate_security.scan_ide_config_files (which handles CRITICAL).
cpv-validate-ide-config = "scripts.cli:validate_ide_config"
# Management tools
cpv-doctor = "scripts.cli:doctor"
cpv-standardize = "scripts.cli:standardize"
# Remote validation launcher — isolated environment for validating external plugins
cpv-remote-validate = "scripts.remote_validation:main"
# Branch-rules setup — create/update GitHub ruleset on a plugin or marketplace repo
cpv-setup-branch-rules = "scripts.setup_branch_rules:main"
# Generic variant — works on ANY GitHub repository (no CPV/plugin/marketplace assumptions)
branch-rules-install = "scripts.setup_branch_rules_generic:main"
# Auth-surface status report (TRDD-b5e44619 Phase C — read-only)
cpv-setup-auth = "scripts.cli:setup_auth"

[tool.ruff]
line-length = 120
# Vendored sample plugins under tests/fixtures/ are DELIBERATELY authored with
# issues (security false-positive bait, bad patterns, malformed structures) to
# exercise CPV's validators / skillaudit / fixers. They are NOT CPV source —
# ruff must never lint or format them, or it would "correct" the very defects
# the tests rely on. Keep ruff's built-in default excludes too (extend, not replace).
# Pattern matches what generate_plugin_repo.gen_pyproject_toml emits (dogfood parity).
extend-exclude = ["**/fixtures", "**/testdata", "**/__fixtures__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # Allow longer lines

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]  # Imports after sys.path manipulation in test files
"scripts/validate_plugin.py" = ["E402"]  # Imports after sys.path setup

[tool.mypy]
python_version = "3.12"
mypy_path = "scripts"
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true

[tool.pyright]
pythonVersion = "3.12"
extraPaths = ["scripts", "tests"]
reportMissingImports = "warning"
typeCheckingMode = "basic"
