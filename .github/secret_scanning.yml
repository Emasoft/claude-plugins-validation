# Secret-scanning allowlist (alerts UI side, NOT push-protection — see docs).
#
# This file tells GitHub's secret-scanning ALERTS to ignore matches inside
# certain paths. It does NOT bypass push protection on its own — push
# protection is governed by repo settings + per-secret allowlist URLs that
# the user clicks at push time.
#
# We allowlist the following paths because they intentionally contain
# fake API-token shapes used as test fixtures:
#
# - tests/test_phase2_strengthening.py uses real-shape Slack / GitHub PAT
#   / AWS / Google tokens to verify that CPV's placeholder-token regex
#   correctly REJECTS them (i.e. real-shape tokens must NOT be classified
#   as placeholders). The fixtures are not real secrets — the literal
#   bytes are also split via Python string concatenation
#   ("xoxb-" + "1234567890-...") so push protection stops blocking new
#   commits that touch this file.
# - tests/test_validate_security.py and tests/test_phase4_minor_observability.py
#   contain similar negative-test fixtures (placeholder-shaped strings to
#   verify the GENERAL gitleaks/trufflehog parsers handle them correctly).
# - tests/fixtures/ holds intentionally-broken sample plugins for the
#   integration suite.
#
# Reference:
#   https://docs.github.com/en/code-security/secret-scanning/configuring-secret-scanning-for-your-repositories#excluding-folders-and-files-from-secret-scanning
paths-ignore:
  - "tests/test_phase2_strengthening.py"
  - "tests/test_phase4_minor_observability.py"
  - "tests/test_validate_security.py"
  - "tests/fixtures/**"
