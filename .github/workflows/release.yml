name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run full plugin validation (strict — same gate as pre-push hook)
        # FAIL-CLOSED (RC-8), and dogfooding what v3.22.0 shipped to everyone else.
        # This handler used to error only on exit 1-4 and fall through otherwise —
        # so `command not found` (127) or an OOM kill (137) SILENTLY PASSED and the
        # release proceeded on a validation that never ran. CPV's verdict codes stop
        # at 4, so anything else is the validator failing to run, not a clean result;
        # the SUMMARY line is required as proof it actually produced a verdict.
        #
        # `tee`, not `> file` + `cat` (issue #180): with the redirect a healthy run
        # and a hung one are byte-identical in the log, and a job killed at its cap
        # never reaches the `cat`. ${PIPESTATUS[0]} keeps the exit code the
        # VALIDATOR's — `$?` after a pipeline is tee's. $exit_code is quoted because
        # shellcheck cannot infer numeric-ness through PIPESTATUS (SC2086).
        # --no-color stays: the report is uploaded as a release asset, and ANSI
        # escapes in it made the validator flag its own output (v2.107.1).
        #
        # PYTHONUNBUFFERED is what actually makes `tee` stream. Measured on the
        # v3.22.2 release run: without it, 1795 of 1803 output lines landed in a
        # single burst at exit, because Python block-buffers stdout when it is a
        # pipe rather than a tty — so `tee` faithfully forwarded a buffer that was
        # only flushed at the end. tee alone is still an improvement (a killed job
        # shows whatever HAS flushed, where the old `> file` + trailing `cat`
        # showed nothing at all), but it is not live progress without this.
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          uv run python scripts/validate_plugin.py . --verbose --strict --no-color 2>&1 \
            | tee validation-report.txt
          exit_code=${PIPESTATUS[0]}
          set -e
          if [ "$exit_code" -eq 0 ]; then
            echo "Validation passed"
            exit 0
          fi
          if [ "$exit_code" -ge 1 ] && [ "$exit_code" -le 4 ] \
             && grep -q "SUMMARY: CRITICAL=" validation-report.txt; then
            echo "::error::Validation failed (exit $exit_code: CRITICAL/MAJOR/MINOR/NIT found)"
            exit "$exit_code"
          fi
          echo "::error::Validator FAILED TO RUN (exit $exit_code) — infra/install failure, NOT a validation verdict. No findings were produced; do not read this as CRITICAL/MAJOR/MINOR/NIT."
          exit 1

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Generate changelog
        run: |
          # Prefer the curated CHANGELOG.md when present — publish.py keeps
          # it in lockstep with conventional commits via git-cliff, and the
          # body is more useful than a flat git log. Only fall back to a
          # generated git-log changelog when CHANGELOG.md is absent, so the
          # git-log work (and its failure modes) is skipped in the common
          # case where the curated file exists.
          if [ -f "CHANGELOG.md" ]; then
            cp CHANGELOG.md changelog.txt
          else
            # No curated changelog: synthesize one from commits since the
            # previous tag (or the whole history if this is the first tag).
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -z "$PREV_TAG" ]; then
              git log --pretty=format:"- %s (%h)" HEAD > changelog.txt
            else
              git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD" > changelog.txt
            fi
          fi

      - name: Create or update GitHub Release (idempotent)
        # Idempotent shell flow — replaces softprops/action-gh-release which
        # 422s when publish.py's Gate-13 already created the release locally.
        # Pattern: `gh release view` to detect existence, then either edit or
        # create. Both branches upload the validation-report artifact.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — editing in place"
            gh release edit "$TAG" \
              --notes-file changelog.txt \
              --verify-tag
            gh release upload "$TAG" validation-report.txt --clobber
          else
            echo "Release $TAG does not exist yet — creating"
            gh release create "$TAG" validation-report.txt \
              --title "$TAG" \
              --notes-file changelog.txt \
              --verify-tag
          fi
