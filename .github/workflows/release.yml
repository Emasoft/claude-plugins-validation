name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# WHY THIS IS THREE JOBS AND NOT ONE (measured, 2026-08-13).
# It used to be a single job running validation (241s) then the whole suite
# SERIALLY (`uv run pytest tests/ -v`, 577s) — 839s of wall clock. publish.py's
# Gate 14 waits for EVERY workflow on the released commit to complete, so that
# 14 minutes was ~70% of a publish, and it was spent re-running, the slow way,
# the exact work ci.yml had already done on the same commit in 251s.
# Validation and the suite are independent, so they run CONCURRENTLY, and the
# suite is sharded with the SAME 4-way pytest-split matrix ci.yml uses. Each
# shard stays SERIAL (no -n) and no-re2 (bare `uv sync` omits the `performance`
# extra), which is what keeps the order-dependent serial-pollution catch and the
# no-re2 catastrophic-backtracking catch alive inside every shard — sharding
# buys wall clock, never coverage.
# The release job needs validation-report.txt (it is uploaded as a release
# asset), so the validate job hands it over as an artifact rather than the
# release job re-running the validator to regenerate a file it already had.
#
# zizmor reports `cache-poisoning` on each setup-uv step here (2 now, 1 before
# the split — the count tracks the number of setup-uv steps, not a new defect
# class). It is KEPT, deliberately: the audit fires because this workflow is
# tag-triggered and setup-uv caches by default, and the cache is exactly what
# makes the 5 dependency installs below cheap — disabling it would give back a
# large share of the wall clock this restructure was written to reclaim. The
# job that actually cuts the release installs nothing and has no cache at all.
# Do not "fix" this by dropping the cache without re-measuring.
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Nothing in this job pushes; leaving the token in .git/config only
          # widens what a compromised step could reach (zizmor `artipacked`).
          # The canon CPV emits has carried this since v2.145.0 — its own tree
          # never got it.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run full plugin validation (strict — same gate as pre-push hook)
        # FAIL-CLOSED (RC-8), and dogfooding what v3.22.0 shipped to everyone else.
        # This handler used to error only on exit 1-4 and fall through otherwise —
        # so `command not found` (127) or an OOM kill (137) SILENTLY PASSED and the
        # release proceeded on a validation that never ran. CPV's verdict codes stop
        # at 4, so anything else is the validator failing to run, not a clean result;
        # the SUMMARY line is required as proof it actually produced a verdict.
        #
        # `tee`, not `> file` + `cat` (issue #180): with the redirect a healthy run
        # and a hung one are byte-identical in the log, and a job killed at its cap
        # never reaches the `cat`. ${PIPESTATUS[0]} keeps the exit code the
        # VALIDATOR's — `$?` after a pipeline is tee's. $exit_code is quoted because
        # shellcheck cannot infer numeric-ness through PIPESTATUS (SC2086).
        # --no-color stays: the report is uploaded as a release asset, and ANSI
        # escapes in it made the validator flag its own output (v2.107.1).
        #
        # PYTHONUNBUFFERED makes the PHASE BANNERS appear at their true time
        # rather than whenever a 4-8 KB buffer happens to fill (the validator
        # calls no explicit flush), which is what lets you see WHICH phase a hung
        # run died in. Measured honestly, that is all it buys: with it present,
        # 1794 of 1804 lines still arrive at exit — because those lines are the
        # FINAL REPORT, which the validator generates at the end by program
        # structure, not output waiting in a buffer. Do not expect it to stream
        # the report; do expect it to timestamp the progress markers correctly.
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          uv run python scripts/validate_plugin.py . --verbose --strict --no-color 2>&1 \
            | tee validation-report.txt
          exit_code=${PIPESTATUS[0]}
          set -e
          if [ "$exit_code" -eq 0 ]; then
            echo "Validation passed"
            exit 0
          fi
          if [ "$exit_code" -ge 1 ] && [ "$exit_code" -le 4 ] \
             && grep -q "SUMMARY: CRITICAL=" validation-report.txt; then
            echo "::error::Validation failed (exit $exit_code: CRITICAL/MAJOR/MINOR/NIT found)"
            exit "$exit_code"
          fi
          echo "::error::Validator FAILED TO RUN (exit $exit_code) — infra/install failure, NOT a validation verdict. No findings were produced; do not read this as CRITICAL/MAJOR/MINOR/NIT."
          exit 1

      - name: Upload validation report
        # The release job uploads this as a release asset. Handing it over as an
        # artifact is what lets validation run beside the suite instead of inside
        # the release job.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-report
          path: validation-report.txt
          if-no-files-found: error
          retention-days: 7

  test-shard:
    name: Test Shard ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run tests (shard ${{ matrix.group }} of 4)
        # serial + no-re2 WITHIN each shard is deliberate (TRDD-K7P2XR4Q), exactly
        # as in ci.yml: each shard runs pytest WITHOUT -n (serial) and without the
        # google-re2 `performance` extra (bare `uv sync` omits it), so the
        # order-dependent serial-pollution catch and the no-re2 ReDoS catch both
        # stay alive within every shard.
        run: uv run pytest tests/ --splits 4 --group ${{ matrix.group }} -v

  release:
    name: Release
    # Fail-closed: the release is cut only if validation passed AND every test
    # shard passed. `needs` already short-circuits on failure — there is
    # deliberately no `if: always()` here, because a release is exactly the thing
    # that must not proceed on a red gate.
    needs: [validate, test-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The changelog step walks back to the previous tag.
          fetch-depth: 0
          # `gh release` authenticates via GH_TOKEN, and nothing here pushes, so
          # the checkout credential is dead weight in .git/config.
          persist-credentials: false

      - name: Download validation report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validation-report

      - name: Generate changelog
        # The release body is THIS release's section, never the whole file.
        # `cp CHANGELOG.md changelog.txt` shipped every past release's notes
        # as the body of each new one: measured on v5.3.0 that was 109,539
        # chars against GitHub's 125,000-char release-body limit, i.e. a few
        # releases from failing `gh release create` outright — after the tag
        # is already public. The generated canon (generate_plugin_repo.py
        # ::gen_release_yml) has carried this extractor for releases; CPV's
        # own workflow never got it.
        #
        # EVERY branch is BOUNDED. The no-section-match fallback is the
        # git log since the previous tag, NOT the full CHANGELOG — falling
        # back to the whole file re-introduces the exact defect above the
        # moment the section-header format drifts.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          # Strip leading 'v' so v1.2.3 matches ## [1.2.3] — ...
          VERSION="${TAG#v}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            GITLOG=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            GITLOG=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG..HEAD")
          fi
          if [ -f "CHANGELOG.md" ]; then
            # Print the matching header through the NEXT `## ` at column 0
            # (or EOF). The `[—-]` class accepts the canonical em-dash and
            # the legacy hyphen separator — CPV's own CHANGELOG uses the
            # hyphen form, so matching only the em-dash would silently take
            # the fallback on every release.
            SECTION=$(awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\] [—-] " {found=1; print; next}
              found && /^## / {exit}
              found {print}
            ' CHANGELOG.md)
            if [ -n "$SECTION" ]; then
              printf '%s\n' "$SECTION" > changelog.txt
              echo "::notice::Release body extracted from CHANGELOG.md section for $VERSION"
            else
              echo "::warning::No CHANGELOG.md section matched ## [$VERSION] — falling back to the git log since $PREV_TAG"
              printf '%s\n' "$GITLOG" > changelog.txt
            fi
          else
            printf '%s\n' "$GITLOG" > changelog.txt
          fi

      - name: Create or update GitHub Release (idempotent)
        # Idempotent shell flow — replaces softprops/action-gh-release which
        # 422s when publish.py's Gate-13 already created the release locally.
        # Pattern: `gh release view` to detect existence, then either edit or
        # create. Both branches upload the validation-report artifact.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — editing in place"
            gh release edit "$TAG" \
              --notes-file changelog.txt \
              --verify-tag
            gh release upload "$TAG" validation-report.txt --clobber
          else
            echo "Release $TAG does not exist yet — creating"
            gh release create "$TAG" validation-report.txt \
              --title "$TAG" \
              --notes-file changelog.txt \
              --verify-tag
          fi
