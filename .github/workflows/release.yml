name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run full plugin validation (strict — same gate as pre-push hook)
        run: |
          set +e
          uv run python scripts/validate_plugin.py . --verbose --strict > validation-report.txt 2>&1
          exit_code=$?
          set -e
          cat validation-report.txt
          # Strict mode: any CRITICAL/MAJOR/MINOR/NIT (exit codes 1-4) blocks release.
          if [ $exit_code -ge 1 ] && [ $exit_code -le 4 ]; then
            echo "::error::Validation failed with exit code $exit_code"
            exit $exit_code
          fi

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD)
          fi

          # Prefer the curated CHANGELOG.md when present — publish.py keeps
          # it in lockstep with conventional commits via git-cliff, and the
          # body is more useful than a flat git log.
          if [ -f "CHANGELOG.md" ]; then
            cp CHANGELOG.md changelog.txt
          else
            echo "$CHANGELOG" > changelog.txt
          fi
          echo "changelog_file=changelog.txt" >> $GITHUB_OUTPUT

      - name: Create or update GitHub Release (idempotent)
        # Idempotent shell flow — replaces softprops/action-gh-release which
        # 422s when publish.py's Gate-13 already created the release locally.
        # Pattern: `gh release view` to detect existence, then either edit or
        # create. Both branches upload the validation-report artifact.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — editing in place"
            gh release edit "$TAG" \
              --notes-file changelog.txt \
              --verify-tag
            gh release upload "$TAG" validation-report.txt --clobber
          else
            echo "Release $TAG does not exist yet — creating"
            gh release create "$TAG" validation-report.txt \
              --title "$TAG" \
              --notes-file changelog.txt \
              --verify-tag
          fi
