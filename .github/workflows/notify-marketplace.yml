# Notify marketplace repo when this plugin is updated
# Place this in each plugin repo: .github/workflows/notify-marketplace.yml
#
# SETUP INSTRUCTIONS:
# 1. Create a Personal Access Token (PAT):
#    - Go to GitHub Settings → Developer settings → Personal access tokens → Tokens (classic)
#    - Click "Generate new token (classic)"
#    - Give it a descriptive name like "Plugin Marketplace Notification"
#    - Select scope: 'repo' (Full control of private repositories)
#    - Click "Generate token" and COPY the token (you won't see it again!)
#
# 2. Add the PAT as a secret to THIS plugin repository:
#    - Go to your plugin repo → Settings → Secrets and variables → Actions
#    - Click "New repository secret"
#    - Name: MARKETPLACE_PAT
#    - Value: paste the PAT you copied in step 1
#    - Click "Add secret"
#
# 3. Update the MARKETPLACE_OWNER and MARKETPLACE_REPO variables below:
#    - MARKETPLACE_OWNER: Your GitHub username or org that owns the marketplace repo
#    - MARKETPLACE_REPO: The name of your marketplace repository
#
# IMPORTANT: Do NOT use GITHUB_TOKEN - it lacks permissions to trigger workflows in other repos!

name: Notify Marketplace

on:
  push:
    branches: [main, master]
    paths:
      - '.claude-plugin/plugin.json'
      - 'hooks/**'
      - 'commands/**'
      - 'agents/**'
      - 'skills/**'
      - 'scripts/**'

env:
  # ⚠️ REQUIRED: Update these values to point to your marketplace repository
  # Example: If your marketplace is at https://github.com/johndoe/my-claude-plugins
  #   MARKETPLACE_OWNER: 'johndoe'
  #   MARKETPLACE_REPO: 'my-claude-plugins'
  MARKETPLACE_OWNER: 'Emasoft'
  MARKETPLACE_REPO: 'emasoft-plugins'

permissions:
  contents: read

concurrency:
  group: notify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get plugin info
        id: plugin
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # Quote $GITHUB_OUTPUT (shellcheck SC2086): the path is set by the
          # runner and is whitespace-free on GitHub-hosted runners, but a
          # self-hosted runner with a space in its workspace path would break
          # an unquoted redirect. Matches the quoting in gen_notify_marketplace_yml.
          echo "name=$REPO_NAME" >> "$GITHUB_OUTPUT"
          echo "ref=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Trigger marketplace update
        uses: peter-evans/repository-dispatch@5fc4efd1a4797ddb68ffd0714a238564e4cc0e6f # v4.0.0
        with:
          token: ${{ secrets.MARKETPLACE_PAT }}
          repository: ${{ env.MARKETPLACE_OWNER }}/${{ env.MARKETPLACE_REPO }}
          event-type: plugin-updated
          client-payload: |
            {
              "plugin": "${{ steps.plugin.outputs.name }}",
              "ref": "${{ steps.plugin.outputs.ref }}",
              "source_repo": "${{ github.repository }}",
              "triggered_by": "${{ github.actor }}"
            }

      - name: Summary
        env:
          PLUGIN_NAME: ${{ steps.plugin.outputs.name }}
          PLUGIN_REF: ${{ steps.plugin.outputs.ref }}
        run: |
          # Single grouped redirect with a quoted target (shellcheck SC2129 +
          # SC2086): one open of the step-summary file instead of six, and the
          # path is quoted so a whitespace-containing runner workspace can't
          # break it. MARKETPLACE_OWNER/REPO are read from the workflow-level
          # shell env (set in the top-level env: block) rather than re-
          # interpolated as GitHub expressions, keeping the run-script free of
          # raw expression interpolation. Mirrors gen_notify_marketplace_yml.
          {
            echo "## Marketplace Notification"
            echo ""
            echo "Triggered update in $MARKETPLACE_OWNER/$MARKETPLACE_REPO"
            echo ""
            echo "- Plugin: $PLUGIN_NAME"
            echo "- Commit: $PLUGIN_REF"
          } >> "$GITHUB_STEP_SUMMARY"
